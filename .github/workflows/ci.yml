name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
      - name: Run finite-instance checks
        run: |
          set -e
          if [ -f checks/run_all.py ]; then
            python checks/run_all.py
          else
            for script in checks/verify_*.py; do
              echo "Running $script..."
              python "$script"
            done
          fi
